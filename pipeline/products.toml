# What this repository publishes: the world's airports, heliports, seaplane bases and balloonports from
# OurAirports (public domain), the closed ones left out — every record in `airports.json`, and the same
# records as a pyramid of Mapbox vector tiles beside it, `land/airports/` (an index and its versioned
# tiles, zooms 2 to 10). The fetcher is the site's `scripts/fetch-airports.py`, whose docstring carries
# the measurements; the tiles are written by the site's `scripts/point_tiles.py`.
#
# **Since 2026-11-21, the FAA's special-use airspace and military training routes** (a U.S. Government
# work, "for public use"), each a root of every record and its pyramid the same way: `special-use-airspace`,
# every altitude band of every United States restricted, prohibited, warning, alert and danger area and
# military operations area on the FAA's enroute charts (another country's it carries, withheld), zooms 3 to 10; `military-training-routes`, every segment of
# every IR, VR and SR route, zooms 4 to 9. The fetcher is the site's `scripts/fetch-airspace.py` (its
# docstring carries the measurements); the tiles are written by the site's `scripts/land_tiles.py`.
# **Read once a cycle**: the FAA republishes both every 56 days, and its ArcGIS items name the cycle
# each holds. The step runs every run and makes the pyramid from the published root; it asks the FAA's
# item only once the published cycle has ended, and reads the layer only when the item names a new
# cycle. The hour is the cycle's first moment, so the budget is the cycle, the FAA's lateness and a
# missed run: 1,344 + 72 + 24 hours, so 1,450.
#
# **To the second host alone** (`r2_only`, the site pipeline's D13, its note of 2026-10-09): every file
# of the product is published to Cloudflare R2 and not to Pages, which carries the status alone; the
# root stays on the `published` branch, where the next run seeds from it. `trees` names the folder the
# product writes beside its root (the orchestrator's, 2026-10-20), so it goes to R2 with it.
#
# **The step runs every run; the source is read weekly.** A tree is never banked, so the tiles are
# made again from the published root on every run, whether the workflow's cache restored them or
# not, and the fetcher reads the source itself only once its
# root is a week old (`EVERY_HOURS`, 166): the source changes daily, and a changed set is a new version
# of every tile.
#
# **The budget is the source's lateness, the week, and a missed run.** Measured 2026-10-20: the source's
# last hundred updates a day apart at 01:53 UTC, the newest then 100 hours old; 100 + 166 + 24 is 290
# hours, so 300.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

[steps.airports]
cmd = ["python3", "scripts/fetch-airports.py", "--only=airports"]
lane = "davidmegginson.github.io"

[steps.special-use-airspace]
cmd = ["python3", "scripts/fetch-airspace.py", "--only=special-use-airspace"]
lane = "services6.arcgis.com"

[steps.military-training-routes]
cmd = ["python3", "scripts/fetch-airspace.py", "--only=military-training-routes"]
lane = "services6.arcgis.com"

[products.airports]
title = "Airports, heliports and seaplane bases of the world, with their runways and frequencies (OurAirports)"
step = "airports"
roots = ["airports.json"]
writes = ["airports.json"]
namespace = ["python3", "scripts/fetch-airports.py", "--namespace", "--only=airports"]
max_age_hours = 300
r2_only = true
trees = ["land/airports"]

[products.special-use-airspace]
title = "Special-use airspace: restricted, prohibited, warning, alert and danger areas and military operations areas, each altitude band with its times of use and controlling agency (FAA)"
step = "special-use-airspace"
roots = ["special-use-airspace.json"]
writes = ["special-use-airspace.json"]
namespace = ["python3", "scripts/fetch-airspace.py", "--namespace", "--only=special-use-airspace"]
max_age_hours = 1450
r2_only = true
trees = ["land/special-use-airspace"]

[products.military-training-routes]
title = "Military training routes: IR, VR and SR routes' centerlines, widths and altitudes (FAA)"
step = "military-training-routes"
roots = ["military-training-routes.json"]
writes = ["military-training-routes.json"]
namespace = ["python3", "scripts/fetch-airspace.py", "--namespace", "--only=military-training-routes"]
max_age_hours = 1450
r2_only = true
trees = ["land/military-training-routes"]
